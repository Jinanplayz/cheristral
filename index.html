<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Connect to font hosts early -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Preload the home page hero. The site is client-rendered, so without this
      the browser cannot even start downloading the hero until all the
      JavaScript has arrived and React has rendered. This lets the image
      download run at the same time as the JS.

      If you rename hero-home.webp, update this line too.
    -->
    <link rel="preload" as="image" href="/images/hero-home.webp" fetchpriority="high" />

    <!-- Load fonts once, non-render-blocking, with a noscript fallback -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
      />
    </noscript>

    <title>Cheristral Studio</title>
    <meta name="description" content="Next-Gen Gaming Experiences" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
