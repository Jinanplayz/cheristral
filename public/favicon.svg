  <!-- Primary Glossy Highlight -->
  <ellipse cx="23" cy="33" rx="7" ry="3.5" transform="rotate(-35 23 33)" fill="#ffffff" opacity="0.75" />
  
  <!-- Small Secondary Highlight (Bounce light) -->
